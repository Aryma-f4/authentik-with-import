---
name: Publish Fork Server AMD64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        required: true
        default: poltekkes-v1

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: Build Server AMD64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase owner
        run: echo "LOWER_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.LOWER_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: lifecycle/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.LOWER_OWNER }}/server:${{ inputs.tag }}
          build-args: GIT_BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
